spring.application.name=seat-reservation

# Mapper xml location
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml

# Database Setting
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# 루트 및 프로젝트 패키지 로그 레벨 (DEBUG)
logging.level.root=INFO
logging.level.com.reservation=DEBUG

# MyBatis 쿼리 및 파라미터 바인딩 로그 (TRACE)
logging.level.com.reservation.mapper=TRACE

# Spring 트랜잭션 및 DB 커넥션 로그 (락 시작/해제 시점 추적용)
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG

# P6Spy 라이브러리를 통한 SQL 포맷팅 출력 (선택 사항)
decorator.datasource.p6spy.enable-logging=true